<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LE COCON PET 32 | Salon de toilettage</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#080808">

    <meta name="description"
          content="LE COCON PET 32, un espace dédié au bien-être et à la beauté de vos animaux.">

</head>

<body>

    <!-- GALERIE IMMERSIVE -->
    <div class="gallery-container">
        <div class="gallery">
            <img src="photo1.png" alt="Salon Le Cocon Pet 32">
            <img src="photo2.png" alt="Toilettage pour animaux">
            <img src="photo3.png" alt="Bien-être animal">
            <img src="photo4.png" alt="Soins pour animaux">
            <img src="photo5.png" alt="Le Cocon Pet 32">
        </div>
    </div>

    <!-- SUPERPOSITION -->
    <div class="overlay">

        <!-- HEADER -->
        <header class="header">
            <button id="btn-admin" class="btn btn-admin">
                Administration
            </button>
        </header>

        <!-- CENTRE -->
        <main class="main-content">

            <p class="welcome-text">
                Le paradis des pets
            </p>

            <h1 class="brand-title">
                Bienvenue sur<br>
                <span>LE COCON PET 32</span>
            </h1>

            <p class="tagline">
                Le bien-être de vos compagnons,
                notre priorité.
            </p>

        </main>

        <!-- FOOTER -->
        <footer class="footer">

            <button id="btn-apropos" class="btn btn-outline">
                Découvrir notre univers
            </button>

            <button id="btn-entrer" class="btn btn-primary">
                Prendre rendez-vous
            </button>

        </footer>

        <div class="footer-note">
            LE COCON PET 32 · Bien-être & beauté animale
        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
